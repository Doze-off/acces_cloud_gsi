name: Update Download Stats
on:
  workflow_dispatch:
  repository_dispatch:
    types: [download-event]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update data.json
        run: |
          python - << 'PY'
          import json, datetime
          p='data.json'
          with open(p,'r',encoding='utf-8') as f: data=json.load(f)
          data['totalDownloads']=int(data.get('totalDownloads',0))+1
          data['updatedAt']=datetime.datetime.now().isoformat()
          with open(p,'w',encoding='utf-8') as f: json.dump(data,f,indent=2,ensure_ascii=False)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore: update download stats" || exit 0
          git push
